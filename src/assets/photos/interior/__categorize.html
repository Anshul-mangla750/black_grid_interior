<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interior Image Categorizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  h1 { color: #c5a059; margin-bottom: 10px; font-size: 1.4rem; letter-spacing: 0.1em; }
  .progress { color: #888; margin-bottom: 20px; font-size: 0.9rem; }
  .container { display: flex; gap: 30px; align-items: flex-start; }
  .img-panel { flex: 1; }
  .img-panel img { width: 100%; max-height: 500px; object-fit: contain; border: 2px solid #333; border-radius: 8px; background: #111; }
  .filename { margin-top: 8px; color: #888; font-size: 0.8rem; word-break: break-all; }
  .side-panel { width: 300px; }
  .cat-group { margin-bottom: 12px; }
  .cat-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 6px; letter-spacing: 0.08em; }
  .cat-btn { width: 100%; padding: 10px 14px; margin-bottom: 6px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 0.85rem; text-align: left; transition: all 0.2s; }
  .cat-btn:hover { border-color: #c5a059; color: #c5a059; }
  .cat-btn.selected { background: #c5a059; color: #000; border-color: #c5a059; font-weight: 700; }
  .nav { display: flex; gap: 10px; margin-top: 20px; }
  .nav button { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 0.85rem; }
  .nav button:hover { background: #333; }
  .output-section { margin-top: 30px; }
  .output-section h2 { color: #c5a059; margin-bottom: 10px; font-size: 1rem; }
  textarea { width: 100%; height: 350px; background: #111; color: #0f0; border: 1px solid #333; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.78rem; }
  .copy-btn { margin-top: 8px; padding: 8px 20px; background: #c5a059; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
  .assigned-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .assigned-item { font-size: 0.75rem; padding: 4px 8px; background: #1a1a1a; border-radius: 4px; display: flex; justify-content: space-between; }
  .assigned-item span:last-child { color: #c5a059; }
  .all-done { color: #4caf50; font-weight: 700; font-size: 1.2rem; margin: 20px 0; }
</style>
</head>
<body>
<h1>🎨 INTERIOR IMAGE CATEGORIZER</h1>
<p class="progress" id="progress">Loading...</p>

<div class="container">
  <div class="img-panel">
    <img id="preview" src="" alt="Preview" />
    <div class="filename" id="fname"></div>
  </div>
  <div class="side-panel">
    <div class="cat-group">
      <label>SELECT CATEGORY FOR THIS IMAGE:</label>
      <button class="cat-btn" onclick="assign('living', 'Living Space Design')">🛋️ LIVING ROOM / LOUNGE</button>
      <button class="cat-btn" onclick="assign('bedroom', 'Bedroom Suite Design')">🛏️ BEDROOM / MASTER SUITE</button>
      <button class="cat-btn" onclick="assign('kitchen', 'Kitchen & Dining')">🍽️ KITCHEN / DINING</button>
      <button class="cat-btn" onclick="assign('office', 'Executive Workspace')">💼 OFFICE / WORKSPACE</button>
      <button class="cat-btn" onclick="assign('commercial', 'Commercial & Retail')">🏢 COMMERCIAL / LOBBY</button>
    </div>
    <div class="nav">
      <button onclick="prev()">← PREV</button>
      <button onclick="next()">SKIP →</button>
    </div>
    <div style="margin-top:20px;">
      <label style="font-size:0.75rem;color:#888;display:block;margin-bottom:6px;">ASSIGNED SO FAR:</label>
      <div class="assigned-list" id="assigned-list"></div>
    </div>
  </div>
</div>

<div class="output-section">
  <h2>📋 GENERATED CATEGORY MAP (copy this into projects.js)</h2>
  <textarea id="output" readonly></textarea>
  <button class="copy-btn" onclick="copyOutput()">📋 COPY TO CLIPBOARD</button>
</div>

<script>
const images = [
  '6337009540292875832.jpg',
  '6337009540292875835.jpg',
  '6337009540292875868.jpg',
  '6337009540292875869.jpg',
  '6337009540292875870.jpg',
  '6337009540292875871.jpg',
  '6337009540292875872 (1).jpg',
  '6337009540292875872.jpg',
  '6337009540292875874.jpg',
  '6337009540292875875.jpg',
  '6337009540292875876.jpg',
  '6337009540292875877.jpg',
  '6337009540292875878.jpg',
  '6337009540292875879.jpg',
  '6337009540292875880.jpg',
  '6337009540292875881.jpg',
  '6337009540292875882.jpg',
  '6337009540292875883.jpg',
  '6337009540292875884.jpg',
  '6337009540292875885.jpg',
  '6337009540292875886.jpg',
  '6337009540292875887.jpg',
  '6337009540292875888.jpg',
  '6337009540292875889.jpg',
  '6337009540292875890.jpg',
  '6337009540292875891.jpg',
  '6337009540292875892.jpg',
  '6337009540292875893.jpg',
  '6337009540292875894.jpg',
  '6337009540292875895.jpg',
  '6337009540292875896.jpg',
  '6337009540292875897 (1).jpg',
  '6337009540292875897.jpg',
  '6337009540292875898.jpg',
  '6337009540292875899.jpg',
];

let current = 0;
const assignments = {};

function load(idx) {
  if (idx >= images.length) {
    generateOutput();
    return;
  }
  const fname = images[idx];
  document.getElementById('preview').src = fname;
  document.getElementById('fname').textContent = fname;
  document.getElementById('progress').textContent = `Image ${idx + 1} of ${images.length}`;
  // highlight if already assigned
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  if (assignments[fname]) {
    document.querySelectorAll('.cat-btn').forEach(b => {
      if (b.textContent.toLowerCase().includes(assignments[fname].filter)) b.classList.add('selected');
    });
  }
  updateAssignedList();
}

function assign(filter, category) {
  const fname = images[current];
  assignments[fname] = { filter, category };
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.remove('selected');
    if (b.getAttribute('onclick').includes(`'${filter}'`)) b.classList.add('selected');
  });
  updateAssignedList();
  setTimeout(() => next(), 300);
}

function next() {
  current = Math.min(current + 1, images.length - 1);
  if (current === images.length - 1 && Object.keys(assignments).length === images.length) {
    generateOutput();
  } else {
    load(current);
  }
}

function prev() {
  current = Math.max(current - 1, 0);
  load(current);
}

function updateAssignedList() {
  const list = document.getElementById('assigned-list');
  const entries = Object.entries(assignments);
  list.innerHTML = entries.map(([k, v]) =>
    `<div class="assigned-item"><span>${k.substring(0,16)}...</span><span>${v.filter.toUpperCase()}</span></div>`
  ).join('');
  list.scrollTop = list.scrollHeight;
  generateOutput();
}

function generateOutput() {
  const lines = ['// INTERIOR IMAGE CATEGORY MAP — paste into projects.js interiorCategoryMap'];
  lines.push('const interiorCategoryMap = {');
  for (const [fname, { filter, category }] of Object.entries(assignments)) {
    lines.push(`  '${fname}': { filter: '${filter}', category: '${category}' },`);
  }
  lines.push('};');
  document.getElementById('output').value = lines.join('\n');
}

function copyOutput() {
  const ta = document.getElementById('output');
  ta.select();
  document.execCommand('copy');
  alert('Copied! Now paste it into projects.js as instructed.');
}

load(0);
</script>
</body>
</html>
